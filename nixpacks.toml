# =======================================
# Nixpacks config for Drupal 10 (PHP 8.3)
# Compatible con Railway, Render o Fly.io
# =======================================

#[build]
builder = "nixpacks/php"

#  Dependencias del entorno
[phases.setup]
nixPkgs = ["php", "phpPackages.composer", "nginx", "nodejs_18", "libmysqlclient"]
# nixpacks.toml
#[build]
#builder = "paketobuildpacks/builder:base"

# Fase de instalación
[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.curl",
  "php83Extensions.mbstring",
  "php83Extensions.pdo_mysql",
  "php83Extensions.xml",
  "php83Extensions.json",
  "php83Extensions.opcache",
  "php83Extensions.gd",
  "php83Extensions.zip",
  "nginx",
  "bash",
  "phpPackages.composer"
]















#  Fase de compilación — aquí va Composer
[phases.build]
cmds = [
  # Mostrar versión (diagnóstico)
  #"composer --version",

  # Limpieza previa
  #"rm -rf vendor web/core",


  # Crear carpeta y restaurar tus imágenes ANTES del composer install
  "mkdir -p web/sites/default/files",
  "chmod -R 777 web/sites/default",
  "curl -L $FILES_TAR_URL -o web/sites/default/files.tar.gz",
  "tar -xzf web/sites/default/files.tar.gz -C web/sites/default/",
  "rm web/sites/default/files.tar.gz",
  "ls -la web/sites/default/files",

  # Instalar dependencias del proyecto optimizado
  "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader",
  # Instalar dependencias del proyecto completo pero lento (cuando se hacen updates de drupal)
  #"COMPOSER_ALLOW_SUPERUSER=1 composer install",
  # Confirmar que core existe
  "ls -l web/core | grep install.php || (echo '❌ Drupal core no encontrado' && exit 1)",

  # Reconstruir caché
  #"./vendor/bin/drush cim -y",
  "./vendor/bin/drush cr"
]

#  Fase de ejecución (inicio del servidor PHP)
[start]
cmd = "php -d memory_limit=512M -S 0.0.0.0:${PORT:-8080} -t web"
#[start]
#cmd = "chmod +x ./scripts/start.sh"


