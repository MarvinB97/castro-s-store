# =======================================
# Nixpacks config for Drupal 10 (PHP 8.3)
# Compatible con Railway, Render o Fly.io
# =======================================

[build]
builder = "nixpacks/php"

[phases.setup]
# Instalar dependencias PHP de composer
cmds = [
  # Crear carpeta y restaurar tus imágenes ANTES del composer install
  "mkdir -p web/sites/default/files",
  "chmod -R 777 web/sites/default",
  "curl -L $FILES_TAR_URL -o web/sites/default/files.tar.gz",
  "tar -xzf web/sites/default/files.tar.gz -C web/sites/default/files/",
  "rm web/sites/default/files.tar.gz",
  "ls -la web/sites/default/files",


  "rm -rf web/core vendor",
  "composer install --no-dev --optimize-autoloader"
]

#[phases.build]
# Limpia cachés y prepara el entorno
#cmds = [
#  "mkdir -p web/sites/default/files",
#  "chmod -R 775 web/sites/default/files"
#]

[start]
# Inicia el servidor PHP embebido
# Puedes cambiar el puerto si Railway lo indica (usualmente $PORT)
cmd = "php -d memory_limit=512M -S 0.0.0.0:${PORT:-8080} -t web"

# =======================================
# Variables recomendadas
# =======================================
# En Railway configura:
# - DATABASE_URL = mysql://USER:PASSWORD@HOST:PORT/DATABASE?ssl-mode=REQUIRED
# - DRUPAL_ENVIRONMENT = production
# - PORT = 8080