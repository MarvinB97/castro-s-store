[phases.setup]
nixPkgs = [
  "php83",
  "php83Packages.composer",   
  "php83Extensions.pdo_mysql",
  "php83Extensions.mbstring",
  "php83Extensions.gd",
  "php83Extensions.dom",
  "php83Extensions.session",
  "php83Extensions.simplexml",
  "php83Extensions.filter",
  "php83Extensions.bcmath" 
]

[phases.build]
cmds = [
  # Eliminar contenido previo
  "rm -rf web/sites/default/files",

  # Asegurarse de que la carpeta exista
  "mkdir -p web/sites/default",

  # Dar permisos
  "chmod -R 777 web/sites/default/",

  # Descargar y descomprimir el tar.gz
  "curl -L $FILES_TAR_URL -o web/sites/default/files.tar.gz",
  "tar -xzf web/sites/default/files.tar.gz -C web/sites/default/",
  "rm web/sites/default/files.tar.gz",

  
  # Desbloquear plugins de Composer y permitir ejecución como root
  #"export COMPOSER_ALLOW_SUPERUSER=1",
  "export COMPOSER_ALLOW_PLUGIN=true",

  # Instalar dependencias 
  "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader",
  
  
  # Ejecutar todos los comandos de Composer relacionados con Drupal
  "COMPOSER_ALLOW_SUPERUSER=1 composer drupal:scaffold",                     # reconstruye el core y archivos base
  #"COMPOSER_ALLOW_SUPERUSER=1 composer dump-autoload -o",                    # genera autoload optimizado
  #"COMPOSER_ALLOW_SUPERUSER=1 composer validate --no-check-publish",         # valida el archivo composer.json
  #"COMPOSER_ALLOW_SUPERUSER=1 composer info --name-only",                     # lista los módulos activos (debug útil)

  # Verificar núcleo de Drupal
  "ls -la web | grep core",
  "ls web/modules/contrib",


  # Reconstruir caché
  "php vendor/bin/drush cr"
]

[start]
# Aquí es donde realmente migramos los archivos en cada despliegue
cmd = "chmod -R 777 web/sites/default && php vendor/bin/drush cr && php -S 0.0.0.0:$PORT -t web"
#"php -d memory_limit=512M -S 0.0.0.0:$PORT -t web web/.ht.router.php"